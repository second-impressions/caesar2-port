[project]
name = "c2"
version = "0.1.0"
description = "Caesar II reconstruction toolkit — build, link, and verify the recovered PS.EXE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reccmp",
    "capstone>=5.0.7",
    "pydantic>=2.12.5",
    "typer>=0.24.1",
    "pyyaml>=6.0.3",
    "requests>=2.32",
    "pycdlib>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
reccmp = { path = "../reccmp", editable = true }  # TEMP during formats migration; final pin below
# reccmp = { git = "https://github.com/second-impressions/reccmp.git", rev = "e9bb551f4ce243f0d25f4d1639025b9ac1c9ea68" }

[dependency-groups]
dev = [
    "capstone>=5.0.7",
    "pytest>=8.0",
]

[project.scripts]
c2 = "c2.app:app"

[tool.pytest.ini_options]
# No .pytest_cache: the suite is small enough that --lf/--ff state
# isn't worth a cache directory.
addopts = "-p no:cacheprovider"
