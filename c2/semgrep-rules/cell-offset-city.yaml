rules:
  - id: city-cell-offset-row-first
    message: |
      Row-first city_map cell offset `(y * 80 + x) * 20` detected (Rule 113).
      Write it column-first — `(x + y * 80) * 20` — so the final `lea` uses
      `x` as the base register, matching PS.  Do NOT collapse it into a
      CM_OFF macro: those were removed (they hard-coded the row-first order).
    languages: [c]
    severity: INFO
    pattern-either:
      # Row-first only: the Y*W term appears before X.
      # W is CITY_W (80 / 0x50), CB is CITY_CELL_BYTES (20 / 0x14).
      - pattern: ($Y * 80 + $X) * 20
      - pattern: (80 * $Y + $X) * 20
      - pattern: 20 * ($Y * 80 + $X)
      - pattern: 20 * (80 * $Y + $X)
      - pattern: ($Y * 0x50 + $X) * 0x14
      - pattern: (0x50 * $Y + $X) * 0x14
      - pattern: 0x14 * ($Y * 0x50 + $X)
      - pattern: 0x14 * (0x50 * $Y + $X)
      # Mixed dec/hex
      - pattern: ($Y * 80 + $X) * 0x14
      - pattern: ($Y * 0x50 + $X) * 20
      - pattern: 20 * ($Y * 0x50 + $X)
      - pattern: 0x14 * ($Y * 80 + $X)
    fix: ($X + $Y * 80) * 20
