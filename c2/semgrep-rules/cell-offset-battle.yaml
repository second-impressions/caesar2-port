rules:
  - id: battle-cell-offset-row-first
    message: |
      Row-first battle_map cell offset `(y * 52 + x) * 4` detected (Rule 113).
      Write it column-first — `(x + y * 52) * 4` — so the final `lea` uses
      `x` as the base register, matching PS.  Do NOT collapse it into a
      BM_OFF macro: those were removed (they hard-coded the row-first order).
    languages: [c]
    severity: INFO
    pattern-either:
      # Row-first only: the Y*W term appears before X.
      # W is BATTLE_W (52 / 0x34), CB is BATTLE_CELL_BYTES (4).
      - pattern: ($Y * 52 + $X) * 4
      - pattern: (52 * $Y + $X) * 4
      - pattern: 4 * ($Y * 52 + $X)
      - pattern: 4 * (52 * $Y + $X)
      - pattern: ($Y * 0x34 + $X) * 4
      - pattern: (0x34 * $Y + $X) * 4
      - pattern: 4 * ($Y * 0x34 + $X)
      - pattern: 4 * (0x34 * $Y + $X)
    fix: ($X + $Y * 52) * 4
