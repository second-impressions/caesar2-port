rules:
  # Convert inline ((struct city_cell *)((char *)city_map + REF))->FIELD
  # accesses to the corresponding CM_* macro.  One rule per field
  # because semgrep cannot dispatch macro names from metavariables.

  - id: city-cell-cast-base_kind
    languages: [c]
    severity: INFO
    message: "use CM_KIND($REF)"
    pattern: ((struct city_cell *)((char *)city_map + $REF))->base_kind
    fix: CM_KIND($REF)

  - id: city-cell-cast-terrain
    languages: [c]
    severity: INFO
