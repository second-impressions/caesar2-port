name: Deploy WebAssembly to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ github.run_number }}-${{ github.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Test Pages and versioning contracts
        run: |
          nix develop --command uv run --no-project --with pytest \
            pytest -q \
              tests/test_versioning.py \
              tests/test_port_layering.py \
              tests/test_target_guards.py
      - name: Configure and build WebAssembly
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${GIT_SHA:0:8}"
          nix develop --command bash -lc "
            emcmake cmake --preset wasm-release -B build/pages \
              -DC2_BUILD_NUMBER=${BUILD_NUMBER} \
              -DC2_GIT_HASH=${SHORT_SHA} &&
            cmake --build build/pages --parallel
          "
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp build/pages/caesar2-en.html _site/index.html
          cp build/pages/caesar2-en.html _site/
          cp build/pages/caesar2-en.js _site/
          cp build/pages/caesar2-en.wasm _site/
          cp build/pages/coi-serviceworker.js _site/
          cp build/pages/version.txt _site/
          touch _site/.nojekyll
          echo "Published $(cat _site/version.txt)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
