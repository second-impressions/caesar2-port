name: Build

on:
  push:
    branches: [main]
  pull_request:
    # closed only removes the pull request's preview site.
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  # By pull-request number, not ref: a closed pull request reports the base
  # branch as its ref and would cancel the push run that its merge started.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  C2_BUILD_NUMBER: ${{ github.run_number }}
  C2_GIT_HASH: ${{ github.sha }}
  CCACHE_MAXSIZE: 750M
  CCACHE_COMPRESS: "true"

jobs:
  # ── Linux ────────────────────────────────────────────────────────────
  # The Nix development shell is the single pinned toolchain definition
  # for every non-MSVC target, so CI and a local checkout cannot drift.
  linux:
    name: Linux ${{ matrix.cc }}
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
          - cc: clang
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          scope: dev
      - name: Configure
        run: |
          nix develop --command cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Build
        run: nix develop --command cmake --build build/ci
      - name: Test C targets
        # The recovered-flow and corpus tests need original game data, which
        # is never committed, so CTest omits them unless explicitly supplied.
        run: nix develop --command ctest --test-dir build/ci --output-on-failure
      - name: Test static contracts and tooling
        # Runs inside the project environment so the local c2 package and
        # the git-pinned reccmp toolkit resolve on a clean checkout. The
        # annotation parser has two tracked reconstruction-era failures;
        # everything else, including versioning and Pages contracts, runs
        # on every CI build.
        run: |
          nix develop --command uv run pytest -q \
            --ignore=tests/test_function_annotations.py

  # ── Package build ────────────────────────────────────────────────────
  # What a distribution does: a release tarball (no .git, no submodules,
  # nothing fetched), the host's libraries, an optimized build with the
  # crash symbolizer required, then `cmake --install` into a staging root.
  package:
    name: Linux package (release tarball)
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          scope: dev
      - name: Build from a release tarball
        run: |
          git archive --format=tar --prefix=caesar2-port/ HEAD | tar -x -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/caesar2-port"
          nix develop "$GITHUB_WORKSPACE" --command bash -c '
            set -euo pipefail
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DPORT_WITH_LIBBACKTRACE=ON \
              -DBUILD_TESTING=OFF
            cmake --build build
            DESTDIR="$RUNNER_TEMP/stage" cmake --install build --prefix /usr
            find "$RUNNER_TEMP/stage" -type f | sort
            test -x "$RUNNER_TEMP/stage/usr/bin/caesar2"
            "$RUNNER_TEMP/stage/usr/bin/caesar2" --version
          '

  # ── WebAssembly + Pages artifact ─────────────────────────────────────
  # This is the only Wasm compilation. The deploy job below consumes the
  # exact same files; it never configures or builds a second time.
  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    env:
      EM_CACHE: ${{ github.workspace }}/.cache/emscripten
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          scope: dev
      - name: Restore Wasm configure and system-library cache
        uses: actions/cache@v4
        with:
          path: |
            build/ci-wasm
            .cache/emscripten
          key: wasm-cmake-${{ runner.os }}-${{ hashFiles('flake.lock', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            wasm-cmake-${{ runner.os }}-
      - name: Configure and build once
        # ccache handles source mtimes from a fresh checkout, while EM_CACHE
        # retains the generated SDL3/zlib ports and WasmFS system libraries.
        run: |
          nix develop --command bash -c "
            set -euo pipefail
            # A custom empty EM_CACHE needs its pkg-config parent before the
            # Emscripten zlib port writes zlib.pc.
            mkdir -p \"$EM_CACHE/sysroot/lib/pkgconfig\"
            embuilder build sdl3-mt zlib
            ccache --zero-stats
            emcmake cmake --preset wasm-release -B build/ci-wasm \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache 2>&1 | tee /tmp/wasm-configure.log
            cmake --build build/ci-wasm --parallel 2>&1 | tee /tmp/wasm-build.log
            ccache --show-stats
          "
      - name: Check Wasm link diagnostics
        # Consume the first build log instead of performing a clean rebuild.
        run: |
          if grep -q 'function signature mismatch' /tmp/wasm-build.log; then
            echo '::error::wasm-ld reported function signature mismatches'
            grep -A2 'function signature mismatch' /tmp/wasm-build.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: caesar2-wasm-${{ env.C2_BUILD_NUMBER }}-${{ env.C2_GIT_HASH }}
          path: |
            build/ci-wasm/index.html
            build/ci-wasm/index.js
            build/ci-wasm/index.wasm
            build/ci-wasm/index.wasm.map
            build/ci-wasm/coi-serviceworker.js
            build/ci-wasm/c2-shell.js
            build/ci-wasm/c2-shell.css
            build/ci-wasm/pico.min.css
            build/ci-wasm/caesar2-background.jpg
            build/ci-wasm/caesar2-background-light.jpg
            build/ci-wasm/version.txt
            build/ci-wasm/LICENSE
            build/ci-wasm/favicon.svg
      - name: Assemble the site
        run: |
          mkdir -p _site
          for f in index.html index.js index.wasm index.wasm.map coi-serviceworker.js \
                   c2-shell.js c2-shell.css pico.min.css caesar2-background.jpg \
                   caesar2-background-light.jpg version.txt LICENSE favicon.svg; do
            cp "build/ci-wasm/$f" _site/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  # ── Windows, native ──────────────────────────────────────────────────
  # The Windows build: the shipping compiler, its own CRT, and its own
  # diagnostic set.  Dependencies come from the vcpkg manifest (vcpkg.json)
  # through the vcpkg that Visual Studio ships (msvc-dev-cmd exports its
  # VCPKG_ROOT); built packages are cached in the Actions cache.
  windows-msvc:
    name: Windows MSVC x64
    runs-on: windows-latest
    if: github.event.action != 'closed'
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: lukka/get-cmake@latest
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Configure
        run: cmake --preset windows-msvc-release
      - name: Build
        run: cmake --build --preset windows-msvc-release
      - name: Install
        run: cmake --install build/port/windows-msvc-release --prefix build/port/windows-msvc-release/stage
      - uses: actions/upload-artifact@v4
        with:
          name: caesar2-windows-msvc-x64
          path: |
            build/port/windows-msvc-release/stage/bin/
            build/port/windows-msvc-release/caesar2.pdb

  # ── GitHub Pages: main and pull-request previews ─────────────────────
  # Pages serves one site per repository, from the gh-pages branch: main
  # publishes to /, every pull request from this repository to /pr/N/
  # (forks get artifacts only: their token cannot write), and a closed
  # pull request removes its directory. Pushes to gh-pages are serialized.
  publish:
    name: Publish web build
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --quiet --depth 1 --branch gh-pages "$remote" pages 2>/dev/null; then
            cd pages
          else
            mkdir pages && cd pages && git init --quiet -b gh-pages && git remote add origin "$remote"
          fi
          if [ -n "$PR_NUMBER" ]; then
            target="pr/$PR_NUMBER"
            rm -rf "$target"; mkdir -p "$target"
          else
            # main owns everything at the root except the previews.
            target="."
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name pr -exec rm -rf {} +
          fi
          cp -R ../_site/. "$target/"
          touch .nojekyll
          git add -A
          git commit --quiet -m "Publish ${target} from ${GITHUB_SHA}" || { echo "nothing changed"; exit 0; }
          for attempt in 1 2 3; do
            git push --quiet origin gh-pages && exit 0
            git fetch --quiet origin gh-pages && git rebase --quiet origin/gh-pages
          done
          exit 1
      - name: Point the pull request at its preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/pr/${PR_NUMBER}/"
          # The marker on its own line: a line that starts with an HTML
          # comment is an HTML block, and Markdown would not link inside it.
          body="$(printf '<!-- preview -->\n**Web build of this pull request:** [%s](%s)\n\nUpdated for %s.' "$url" "$url" "$GITHUB_SHA")"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                     --jq '.[] | select(.body | startswith("<!-- preview -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

  preview-cleanup:
    name: Remove pull-request preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Remove pr/N from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch gh-pages "$remote" pages || exit 0
          cd pages
          [ -d "pr/$PR_NUMBER" ] || exit 0
          git rm -rq "pr/$PR_NUMBER"
          git commit --quiet -m "Remove preview of pull request #${PR_NUMBER}"
          git push --quiet origin gh-pages
