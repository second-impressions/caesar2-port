<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Caesar II</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #000;
      color: #fff;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }
    main {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
    }
    canvas {
      display: block;
      width: min(100vw, 133.333333vh);
      height: min(100vh, 75vw);
      image-rendering: pixelated;
      background: #000;
    }
    #status {
      position: fixed;
      bottom: 1rem;
      margin: 0;
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <p id="status" role="status">Loading Caesar II…</p>
  </main>
  <script>
    const canvas = document.getElementById("canvas");
    const status = document.getElementById("status");
    const query = new URLSearchParams(location.search);
    const args = ["--asset-root", "/assets"];
    if (query.get("mouse-lock") === "1") args.push("--mouse-lock");
    if (query.get("smoke-test") === "province") args.push("--smoke-test");

    function formatStatus(text) {
      const match = /^Downloading data\.\.\. \((\d+)\/(\d+)\)$/.exec(text);
      if (!match) return text;
      const downloaded = Number(match[1]) / 1_000_000;
      const total = Number(match[2]) / 1_000_000;
      return `Downloading game data (${downloaded.toFixed(1)} / ${total.toFixed(1)} MB)…`;
    }

    var Module = {
      arguments: args,
      canvas,
      print: (text) => console.log(text),
      printErr: (text) => console.error(text),
      setStatus: (text) => { status.textContent = formatStatus(text); },
      monitorRunDependencies: (remaining) => {
        if (remaining) status.textContent = `Loading game data (${remaining})…`;
        else status.textContent = "Starting Caesar II…";
      },
      onRuntimeInitialized: () => {
        status.textContent = "";
        canvas.focus();
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
