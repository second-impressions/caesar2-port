<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Caesar II</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #17130f;
      color: #e8dcc8;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #352a1d, #17130f 70%);
    }
    main {
      width: min(96vw, 1280px);
      text-align: center;
    }
    canvas {
      display: block;
      width: 100%;
      max-height: 94vh;
      margin: auto;
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      background: #000;
      box-shadow: 0 1rem 4rem #000b;
    }
    #status {
      min-height: 1.5em;
      margin: .75rem 0 0;
      color: #cdbb9e;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <p id="status" role="status">Loading Caesar II…</p>
  </main>
  <script>
    const canvas = document.getElementById("canvas");
    const status = document.getElementById("status");
    const query = new URLSearchParams(location.search);
    const args = ["--asset-root", "/assets"];
    if (query.get("mouse-lock") === "1") args.push("--mouse-lock");
    if (query.get("smoke-test") === "province") args.push("--smoke-test");

    var Module = {
      arguments: args,
      canvas,
      print: (text) => console.log(text),
      printErr: (text) => console.error(text),
      setStatus: (text) => { status.textContent = text; },
      monitorRunDependencies: (remaining) => {
        if (remaining) status.textContent = `Loading game data (${remaining})…`;
        else status.textContent = "Starting Caesar II…";
      },
      onRuntimeInitialized: () => {
        status.textContent = "";
        canvas.focus();
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
