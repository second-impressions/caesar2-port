<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Caesar II</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #000;
      color: #fff;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }
    main {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
    }
    canvas {
      display: block;
      width: var(--c2-canvas-width, 640px) !important;
      height: var(--c2-canvas-height, 480px) !important;
      image-rendering: pixelated;
      background: #000;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas[hidden] {
      display: none;
    }
    #status {
      position: fixed;
      bottom: 1rem;
      margin: 0;
      color: #fff;
    }
    #restart {
      padding: 0.75rem 1.5rem;
      border: 1px solid #aaa;
      border-radius: 0.25rem;
      color: #fff;
      background: #222;
      font: inherit;
      cursor: pointer;
    }
    #restart:hover,
    #restart:focus-visible {
      background: #333;
    }
    #restart[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="canvas" tabindex="0" draggable="false"></canvas>
    <button id="restart" type="button" hidden>Restart Caesar II</button>
    <p id="status" role="status">Loading Caesar II…</p>
  </main>
  <script>
    const canvas = document.getElementById("canvas");
    const restart = document.getElementById("restart");
    const status = document.getElementById("status");
    const query = new URLSearchParams(location.search);
    const smokeOutput = query.has("smoke-test") ? [] : null;
    const args = ["--asset-root", "/assets"];
    const logicalWidth = 640;
    const logicalHeight = 480;
    document.addEventListener(
      "contextmenu",
      (event) => {
        event.preventDefault();
        if (query.get("smoke-test") === "contextmenu") {
          const message = "browser context menu suppressed";
          smokeOutput.push(message);
          console.log(message);
        }
      },
      { capture: true }
    );
    if (query.get("mouse-lock") === "1") args.push("--mouse-lock");
    if (query.get("smoke-test") === "province" ||
        query.get("smoke-test") === "restart") {
      args.push("--smoke-test");
    }
    if (query.get("smoke-test") === "city") args.push("--city-smoke-test");
    if (query.get("smoke-test") === "campania") {
      args.push("--campania-transition-smoke-test");
    }
    if (query.get("smoke-test") === "music") args.push("--music-buffer-smoke-test");
    if (smokeOutput) globalThis.__c2SmokeOutput = smokeOutput;
    if (query.get("smoke-test") === "canvas") {
      requestAnimationFrame(() => {
        canvas.focus();
        const style = getComputedStyle(canvas);
        if (document.activeElement === canvas &&
            style.userSelect === "none" &&
            style.outlineStyle === "none" &&
            !canvas.draggable) {
          const message = "canvas focus styling suppressed";
          smokeOutput.push(message);
          console.log(message);
        } else {
          console.error(
            `canvas style mismatch: focus=${document.activeElement === canvas} ` +
            `select=${style.userSelect} outline=${style.outlineStyle} ` +
            `draggable=${canvas.draggable}`
          );
        }
      });
    }

    function resizeCanvasToIntegerScale() {
      const density = devicePixelRatio || 1;
      const fit = Math.min(
        innerWidth * density / logicalWidth,
        innerHeight * density / logicalHeight
      );
      const scale = Math.max(1, Math.floor(fit));
      canvas.style.setProperty(
        "--c2-canvas-width",
        `${Math.ceil(logicalWidth * scale / density)}px`
      );
      canvas.style.setProperty(
        "--c2-canvas-height",
        `${Math.ceil(logicalHeight * scale / density)}px`
      );
    }

    resizeCanvasToIntegerScale();
    addEventListener("resize", resizeCanvasToIntegerScale);

    function formatStatus(text) {
      const match = /^Downloading data\.\.\. \((\d+)\/(\d+)\)$/.exec(text);
      if (!match) return text;
      const downloaded = Number(match[1]) / 1_000_000;
      const total = Number(match[2]) / 1_000_000;
      return `Downloading game data (${downloaded.toFixed(1)} / ${total.toFixed(1)} MB)…`;
    }

    function showRestartButton() {
      canvas.hidden = true;
      status.textContent = "";
      restart.hidden = false;
      restart.focus();
      const message = "restart control shown";
      if (smokeOutput) smokeOutput.push(message);
      console.log(message);
    }

    restart.addEventListener("click", () => location.reload());

    var Module = {
      arguments: args,
      canvas,
      print: (text) => {
        if (smokeOutput) smokeOutput.push(String(text));
        console.log(text);
      },
      printErr: (text) => {
        if (smokeOutput) smokeOutput.push(String(text));
        console.error(text);
      },
      setStatus: (text) => { status.textContent = formatStatus(text); },
      monitorRunDependencies: (remaining) => {
        if (remaining) status.textContent = `Loading game data (${remaining})…`;
        else status.textContent = "Starting Caesar II…";
      },
      onRuntimeInitialized: () => {
        status.textContent = "";
        canvas.focus();
      },
      onGameExit: showRestartButton
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
